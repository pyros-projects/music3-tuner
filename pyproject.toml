[project]
name = "music3-tuner"
version = "0.1.0"
description = "LoRA trainer for MiniMax-Music3's Hybrid-LM (8B global LM + RVQ depth decoder)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "transformers>=4.55",
    "accelerate>=1.6",
    "peft>=0.15",
    "bitsandbytes>=0.46",
    "safetensors>=0.5",
    "numpy",
    "tqdm",
    "soundfile",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
music3-cache-audio = "music3_tuner.cache_audio:main"
music3-generate-codes = "music3_tuner.generate_codes:main"
music3-train = "music3_tuner.train:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music3_tuner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: needs local MiniMax-Music3 weights under ~/models/MiniMaxM3",
    "gpu: needs CUDA",
]
